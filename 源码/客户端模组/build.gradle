plugins {
    id "net.fabricmc.fabric-loom-remap" version "1.17.21"
}

group = "world.hechao"
version = "0.2.0"

base {
    archivesName = "FleshParkAssets"
}

loom {
    accessWidenerPath = file("src/main/resources/fleshpark.accesswidener")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// 贴图和模型是 客户端资源/生成资源.py 生成的，不进版本管理
sourceSets.main.resources.srcDirs "generated", "generated_media"

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

processResources {
    inputs.property("version", project.version)
    filteringCharset = "UTF-8"
    filesMatching("fabric.mod.json") {
        expand(version: project.version)
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
